<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zodiac Dragon Character V1 — Three.js Runtime Gate</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      html, body { margin: 0; height: 100%; background: #0d131d; overflow: hidden; }
      body { display: grid; grid-template-rows: auto 1fr auto; }
      header, footer { padding: 10px 16px; background: #121c29; border-bottom: 1px solid #243548; }
      footer { border-top: 1px solid #243548; border-bottom: 0; font-size: 12px; color: #9fb0c4; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      #status { font-size: 12px; color: #9fb0c4; }
      main { position: relative; min-height: 0; }
      #viewport { width: 100%; height: 100%; display: block; outline: none; }
      #panel { position: absolute; top: 12px; left: 12px; width: min(340px, calc(100vw - 24px)); max-height: calc(100% - 24px); overflow: auto; padding: 12px; background: rgba(13, 19, 29, .86); border: 1px solid #2b4056; border-radius: 8px; backdrop-filter: blur(8px); }
      #panel h2 { margin: 0 0 8px; font-size: 13px; }
      #actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      button { border: 1px solid #36516c; border-radius: 5px; padding: 7px 8px; color: #dce8f4; background: #1a2a3b; cursor: pointer; font-size: 12px; }
      button:hover, button:focus-visible { border-color: #7ab3e6; background: #263f57; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 10px 0 0; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #bfd0e3; }
      .ok { color: #9ee6b4; } .warn { color: #f0cf8c; } .fail { color: #ff9b9b; }
    </style>
  </head>
  <body>
    <header>
      <h1>Zodiac Dragon Character V1 · Three.js Runtime Gate</h1>
      <div id="status">Loading runtime asset…</div>
    </header>
    <main>
      <canvas id="viewport" aria-label="Zodiac dragon character viewport"></canvas>
      <section id="panel" aria-label="Runtime QA panel">
        <h2>Semantic actions</h2>
        <div id="actions">
          <button data-action="idle">Idle</button>
          <button data-action="head_shake">HeadShake</button>
          <button data-action="head_tilt">HeadTilt</button>
          <button data-action="dragon_proud">DragonProud</button>
          <button data-action="bounce">Bounce</button>
          <button data-action="roar">Roar</button>
          <button data-action="tail_wag">TailWag</button>
        </div>
        <pre id="audit">Waiting for GLB audit…</pre>
      </section>
    </main>
    <footer>Hover the character for HeadTilt · click the character for Bounce · drag to orbit</footer>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
